# This docker compose file run only services required for development environment like database, minio, mailhog etc. It does not run apps itself, it is automatically used with pnpm dev command
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playr}
      POSTGRES_DB: ${POSTGRES_DB:-playr}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playr} -h localhost -p ${POSTGRES_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playr-network

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":${S3_CONSOLE_PORT:-9001}"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_PORT:-9000}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - playr-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:${S3_PORT:-9000} \${S3_ACCESS_KEY} \${S3_SECRET_KEY} || true;
        /usr/bin/mc mb myminio/public --ignore-existing;
        /usr/bin/mc anonymous set download myminio/public;
        /usr/bin/mc mb myminio/private --ignore-existing;
        echo 'MinIO setup completed successfully';
        exit 0;
      "
    networks:
      - playr-network

  mailhog:
    image: mailhog/mailhog
    platform: linux/amd64
    ports:
      - "${MAILHOG_PORT:-1025}:1025"
      - "${MAILHOG_CONSOLE_PORT:-8025}:8025"
    networks:
      - playr-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - playr-network

networks:
  playr-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

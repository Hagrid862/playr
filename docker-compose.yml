# This is default docker compose file used for running apps locally in container, it also runs all necessary services and sets up environment variables credentials

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playr}
      POSTGRES_DB: ${POSTGRES_DB:-playr}
    healthcheck:  
     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playr} -h localhost -p ${POSTGRES_PORT:-5432}"]  
     interval: 5s  
     timeout: 5s  
     retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playr-network

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":${S3_CONSOLE_PORT:-9001}"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${S3_PORT:-9000}/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - playr-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        set -eu; 
        /usr/bin/mc alias set myminio http://minio:${S3_PORT:-9000} \"${S3_ACCESS_KEY:-minioadmin}\" \"${S3_SECRET_KEY:-minioadmin}\";  
        /usr/bin/mc mb myminio/public --ignore-existing;
        /usr/bin/mc anonymous set download myminio/public;
        /usr/bin/mc mb myminio/private --ignore-existing;
        echo 'MinIO setup completed successfully';
        exit 0;
      "
    networks:
      - playr-network

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - playr-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_PORT:-1025}:1025"
      - "${MAILHOG_CONSOLE_PORT:-8025}:8025"
    networks:
      - playr-network

  api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    ports:
      - "8000:${API_PORT:-8000}"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-playr}:${POSTGRES_PASSWORD:-playr}@db:5432/${POSTGRES_DB:-playr}?schema=public
      # Used by packages/db prisma.config fallback URL if DATABASE_URL were unset; matches service name `db`.
      POSTGRES_HOST: db
      S3_ENDPOINT: http://minio:${S3_PORT:-9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private}
      S3_PUBLIC_URL: http://localhost:${S3_PORT:-9000}/public
      MAIL_HOST: mailhog
      MAIL_PORT: ${MAIL_PORT:-1025}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-test-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-test-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >
      /bin/sh -c "
      apk add --no-cache ffmpeg && 
      corepack enable && 
      pnpm install && 
      pnpm turbo run prisma:generate --filter=@repo/db && 
      pnpm turbo run prisma:push --filter=@repo/db && 
      pnpm turbo run dev --filter=@repo/api"
    depends_on:
      db:  
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - playr-network

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/web"
    depends_on:
      - api
    networks:
      - playr-network

  admin:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "3002:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/admin"
    depends_on:
      - api
    networks:
      - playr-network

  artist:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - artist_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/artist"
    depends_on:
      - api
    networks:
      - playr-network

networks:
  playr-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  api_node_modules:
  web_node_modules:
  admin_node_modules:
  artist_node_modules:

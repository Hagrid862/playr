# This is default docker compose file used for running apps locally in container, it also runs all necessary services and sets up environment variables credentials

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hagrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hagrid}
      POSTGRES_DB: ${POSTGRES_DB:-playr}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playr-network

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - playr-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 \${MINIO_ROOT_USER} \${MINIO_ROOT_PASSWORD} || true;
        /usr/bin/mc mb myminio/public --ignore-existing;
        /usr/bin/mc anonymous set download myminio/public;
        /usr/bin/mc mb myminio/private --ignore-existing;
        echo 'MinIO setup completed successfully';
        exit 0;
      "
    networks:
      - playr-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - playr-network

  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hagrid}:${POSTGRES_PASSWORD:-hagrid}@db:5432/${POSTGRES_DB:-playr}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev --filter=@repo/api"
    depends_on:
      - db
      - minio
    networks:
      - playr-network

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/web"
    depends_on:
      - api
    networks:
      - playr-network

  admin:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/admin"
    depends_on:
      - api
    networks:
      - playr-network

  artist:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    command: /bin/sh -c "corepack enable && pnpm install && pnpm turbo run dev:host --filter=@repo/artist"
    depends_on:
      - api
    networks:
      - playr-network

networks:
  playr-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

# This docker compose file is not for run in production environemnt, it is for running locally for testing purposes only, build production-ready images instead of running that on development servers and environments

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playr}
      POSTGRES_DB: ${POSTGRES_DB:-playr}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - playr-network

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data
    networks:
      - playr-network

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 \${S3_ACCESS_KEY} \${S3_SECRET_KEY} || true;
        /usr/bin/mc mb myminio/public --ignore-existing;
        /usr/bin/mc anonymous set download myminio/public;
        /usr/bin/mc mb myminio/private --ignore-existing;
        echo 'MinIO setup completed successfully';
        exit 0;
      "
    networks:
      - playr-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - playr-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: playr-api:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-playr}:${POSTGRES_PASSWORD:-playr}@db:5432/${POSTGRES_DB:-playr}?schema=public
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_secret}
      NODE_ENV: production
      THROTTLE_ENABLED: ${THROTTLE_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
    depends_on:
      - db
      - minio
    networks:
      - playr-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        NODE_ENV: production
    image: playr-web:${IMAGE_TAG:-latest}
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - playr-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        NODE_ENV: production
    image: playr-admin:${IMAGE_TAG:-latest}
    ports:
      - "3002:80"
    depends_on:
      - api
    networks:
      - playr-network

  artist:
    build:
      context: .
      dockerfile: apps/artist/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        NODE_ENV: production
    image: playr-artist:${IMAGE_TAG:-latest}
    ports:
      - "3001:80"
    depends_on:
      - api
    networks:
      - playr-network

networks:
  playr-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
